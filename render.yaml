services:
  - type: web
    name: breathe-esg
    runtime: python
    plan: free
    rootDir: .
    buildCommand: ./render-build.sh
    startCommand: cd backend && gunicorn breathe_esg.wsgi --bind 0.0.0.0:$PORT --workers 2 --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TIMEOUT_S
        value: "20"
      - key: DEFAULT_TENANT_SLUG
        value: demo-enterprise-client
      - key: DEFAULT_TENANT_NAME
        value: Demo Enterprise Client
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe
